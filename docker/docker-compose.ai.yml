---
services:
  hydraquant:
    # HydraQuant cognitive trading organism (build from Dockerfile.ai)
    build:
      context: .
      dockerfile: "./docker/Dockerfile.ai"
    restart: unless-stopped
    container_name: hydraquant
    env_file:
      - .env
    volumes:
      - "./user_data:/freqtrade/user_data"
    # Freqtrade REST API (localhost only — HydraQuant FastAPI is on :8890)
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade --logfile /freqtrade/user_data/logs/hydraquant.log --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite --config /freqtrade/user_data/config_binance_testnet_spot.json --strategy HydraSizer
