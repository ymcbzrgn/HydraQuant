site_name: HydraQuant
site_description: An autonomous cognitive organism for cryptocurrency trading.
repo_url: https://github.com/ymcbzrgn/HydraQuant
edit_uri: edit/main/docs/
use_directory_urls: true

nav:
  - Home: ../README.md
  - Manifesto: HYDRAQUANT.md
  - Architecture: ARCHITECTURE.md
  - Neural Organism: NEURAL_ORGANISM.md
  - Evidence Engine: EVIDENCE_ENGINE.md
  - LLM Routing: LLM_ROUTING.md
  - Features: FEATURES.md
  - Deployment: DEPLOYMENT.md
  - Roadmap: ROADMAP.md
  - Changelog: CHANGELOG.md
  - Phases:
      - Phase 23 — Jina Migration: PHASE23_JINA_MIGRATION.md
      - Phase 26 — Organism Evolution: PHASE26_ML_ORGANISM_EVOLUTION.md
      - Phase 27 Alpha — Asymmetric Alpha: PHASE27_ALPHA.md
      - Phase 27 R&D: PHASE27_ARGE.md
      - Phase 28 — Database Evolution: PHASE28_DATABASE_EVOLUTION.md
      - Phase 29 Alpha — Sensory Expansion: PHASE29_ALPHA.md
      - Phase 29 R&D: PHASE29_ARGE.md

theme:
  name: material
  palette:
    - scheme: default
      primary: "deep purple"
      accent: "amber"
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: "deep purple"
      accent: "amber"
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
